name: diagram
version: 0.1.0.0
github: "githubuser/diagram"
license: BSD3
author: "Gianluca Sant"
maintainer: "sdrubolandia@gmail.com"
copyright: "2022 Gianluca Sant"

extra-source-files:
  - README.md
  - ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/githubuser/diagram#readme>

dependencies:
  - base >= 4.7 && < 5
  - containers
  - flow >= 2.0.0.4
  - parser-combinators == 1.3.0
  - parsec == 3.1.16.1
  - mtl == 2.2.2
  - extra == 1.7.14
  - vector == 0.13.1.0
  - utility-ht >= 0.0.17
  - directory == 1.3.7.1
  - filepath == 1.4.2.2
  - bytestring == 0.11.5.3
  - binary == 0.8.9.1
  - text == 2.0.2
  - IfElse

library:
  source-dirs:
    - src/Font
    - src/Intermediate
    - src/IntermediateToAbs
    - src/Print
    - src/Svg
    - src/Parser
    - src/Analysis

default-extensions:
  - RecordWildCards
  - DuplicateRecordFields
  - MultiParamTypeClasses
  - FlexibleInstances
  - FunctionalDependencies
  - TupleSections
  - TypeFamilies
  - RecursiveDo
  - FlexibleContexts
  - PostfixOperators

executables:
  diagram-exe:
    main: Main.hs
    source-dirs:
      - app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
      - -no-keep-hi-files
      - -no-keep-o-files
    dependencies:
      - diagram

tests:
  haskell-example-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - diagram
    - hspec
    - hspec-discover
    - QuickCheck